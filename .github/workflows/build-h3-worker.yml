name: Build H3 worker

on:
  workflow_dispatch:
  push:
    paths:
      - "infra/h3-worker/**"
      - ".github/workflows/build-h3-worker.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable worker
        uses: docker/build-push-action@v6
        with:
          context: infra/h3-worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/meldex-h3-worker:h3-${{ github.sha }}-ae7bee0
          build-args: |
            VLLM_OMNI_COMMIT=ae7bee0c43c780a8e21d0b5e4b92a7eaeaea8783
          provenance: true
          sbom: true
