# =============================================================================
# Meldex AI — docker-compose.yml
#
# Services:
#   db       — PostgreSQL 16
#   ollama   — Ollama LLM server (CPU; add `deploy.resources` for GPU)
#   app      — Meldex AI Next.js application
#
# Usage:
#   cp .env.example .env.local          # fill in secrets
#   docker compose up -d db ollama      # start backing services first
#   docker compose up -d app            # then start the app
#
# Or start everything at once:
#   docker compose up -d
# =============================================================================

version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meldex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meldex_secret}
      POSTGRES_DB: ${POSTGRES_DB:-meldex_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meldex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama ─────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment to enable NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Meldex AI application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meldex}:${POSTGRES_PASSWORD:-meldex_secret}@db:5432/${POSTGRES_DB:-meldex_ai}
      OLLAMA_BASE_URL: http://ollama:11434
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  ollama_data:
