# =============================================================================
# Meldex AI — Nginx reverse proxy configuration
# Deploy to: /etc/nginx/sites-available/meldex
# Enable:    ln -s /etc/nginx/sites-available/meldex /etc/nginx/sites-enabled/
# Test:      nginx -t
# Reload:    systemctl reload nginx
#
# Replace YOUR_DOMAIN with your actual domain before deploying.
# SSL certificates are managed by Certbot — run after enabling this config:
#   certbot --nginx -d YOUR_DOMAIN
# =============================================================================

# ── Rate limiting zones ───────────────────────────────────────────────────────
# 10 req/s per IP for API routes
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# 30 req/s per IP for general pages
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── SSL (Certbot fills these in) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── TLS settings ──────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options            "DENY"                      always;
    add_header X-Content-Type-Options     "nosniff"                   always;
    add_header X-XSS-Protection           "1; mode=block"             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_buffers     16 8k;
    gzip_http_version 1.1;
    gzip_min_length  256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml application/geo+json
        image/svg+xml font/woff font/woff2;

    # ── Upload size limit ─────────────────────────────────────────────────
    client_max_body_size 50M;
    client_body_timeout  60s;

    # ── API routes — stricter rate limiting ───────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Chat streaming needs longer timeout
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  60s;
        proxy_buffering       off;
    }

    # ── Next.js static assets — immutable cache ───────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Next.js image optimization ────────────────────────────────────────
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Public static files ───────────────────────────────────────────────
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ── Main application ──────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket + Server-Sent Events support (chat streaming)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout  30s;
        proxy_cache_bypass    $http_upgrade;
    }

    # ── Block common attack paths ─────────────────────────────────────────
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
